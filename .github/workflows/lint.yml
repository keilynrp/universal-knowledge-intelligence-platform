name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Required-gate coverage (blocking) ────────────────────────────────────
  # Issue #317 / ER-SDLC-001: keeps each workflow's *-required-gate job (see
  # test.yml's backend-required-gate comment) honest — its `needs` list must
  # exactly match the workflow's actual blocking jobs, so it can never go
  # stale the way a hand-maintained branch-protection check list would.
  required-gate-coverage-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enforce required-gate aggregation coverage
        run: python scripts/lint_required_gates.py

  enterprise-readiness-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enforce enterprise readiness source of truth
        run: python scripts/lint_enterprise_readiness.py

  release-evidence-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Enforce release evidence index structure
        run: python scripts/lint_release_evidence.py

  # ── OpenAPI spec drift (blocking) ─────────────────────────────────────────
  # The committed sdk/openapi.json is the baseline generated SDK clients are
  # built from. A stale baseline is worse than none: it looks authoritative
  # while describing an API that no longer exists. This job fails the PR that
  # changed a route without regenerating.
  openapi-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install backend dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Check the committed OpenAPI spec matches the application
        run: node scripts/generate-sdk.mjs --check

  # ── Generated SDK client drift (blocking) ─────────────────────────────────
  # openapi-drift proves sdk/openapi.json is current; this proves the committed
  # clients were regenerated from it. Without this, a PR can refresh the spec and
  # ship clients that describe the previous API. The generators run inside the
  # same pinned Docker images the local script uses, so CI and local produce
  # byte-identical output (Linux LF, pinned node:20-slim / python:3.12-slim).
  sdk-clients-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the committed SDK clients match sdk/openapi.json
        run: bash scripts/generate-sdk-clients.sh --check

  # ── i18n catalog gates (blocking) ─────────────────────────────────────────
  # frontend/app/i18n/translations.ts is the single definition of every
  # user-facing string; backend/i18n/catalog.*.json is a generated mirror the
  # backend loads. A stale mirror serves text the product no longer says, and
  # says it only on server-rendered surfaces (PDF, PPTX, Excel, email) where
  # nobody is looking. This job fails the PR that edited the catalog without
  # regenerating. `--check` also regenerates twice and compares, so a
  # non-deterministic generator fails here rather than flapping later.
  #
  # The second step is the EN/ES parity gate. Contrary to what #209 and the
  # original proposal both stated, no such gate existed anywhere before this —
  # not in CI, not in the test suite, and not in the type system, since
  # LanguageContext.tsx casts the catalog to Record<Language, Record<string,
  # string>> and a cast checks nothing. Parity held by whoever last edited the
  # file.
  i18n-catalog-gates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The generator parses the catalog with the TypeScript compiler's own
      # AST, and typescript is a frontend dependency.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Check the committed i18n projection matches the frontend catalog
        run: node scripts/generate-i18n-projection.mjs --check

      # Presence only. It cannot tell a translation from a placeholder, which is
      # stated in the script rather than left for someone to infer from a green
      # check. Covers the frontend catalog as well as the projection: gating
      # only the mirror would move a one-sided key one file upstream instead of
      # preventing it.
      - name: Check EN/ES parity across the catalog and its projection
        run: node scripts/check-i18n-parity.mjs

  # ── Generated repository metrics drift (blocking) ─────────────────────────
  # README.md's test/API/toolchain badges, tree summary, tech-stack table
  # rows, and closing test-stats line — plus docs/generated/repo_metrics.json
  # — are a generated projection (issue #295), not hand-maintained claims.
  # This job re-derives every metric from its authoritative source (pytest
  # collection, `vitest list`, sdk/openapi.json, Dockerfile.backend,
  # frontend/package-lock.json) and fails the PR that changed one of those
  # sources without regenerating.
  repo-metrics-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Check generated repository metrics match their authoritative sources
        run: python scripts/generate_repo_metrics.py --check

  # ── Domain scope contract lint (blocking) ─────────────────────────────────
  domain-scope-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Enforce domain scope contract
        run: python scripts/lint_domain_scope.py

  # ── Entity query contract lint (blocking) ─────────────────────────────────
  entity-query-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Enforce entity_base_q contract (migrated files)
        run: python scripts/lint_entity_query.py

  # ── Backend lint on changed files (blocking) ───────────────────────────────
  # Equivalent of frontend-lint below, for backend/: the repo-wide ratchet
  # (lint-debt-ratchet, further down) only guarantees "no worse in total" —
  # it would tolerate new violations in a touched file if unrelated cleanup
  # elsewhere in the same PR kept the total flat. This closes that loophole
  # by requiring every backend/**.py file the diff touches to be fully
  # Ruff-clean (whole file, matching frontend-lint's own whole-file
  # strictness), independent of the repo-wide baseline (issue #294).
  backend-lint-changed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff (pinned — see docs/operating/LINT_DEBT_RATCHET.md)
        run: pip install ruff==0.16.4

      - name: Resolve diff base SHA
        id: base-sha
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          echo "sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Run Ruff on changed backend files
        run: python scripts/lint_backend_changed.py check --base-sha "${{ steps.base-sha.outputs.sha }}"

  # ── Repo-wide lint debt ratchet (blocking) ─────────────────────────────────
  # Was two non-blocking debt-radar jobs (backend ruff --exit-zero, frontend
  # eslint continue-on-error). Folded into one job that measures both tools
  # the same way and fails if either total deviates from the committed
  # baseline in either direction (issue #294) — see
  # docs/operating/LINT_DEBT_RATCHET.md for the exact-equality policy this
  # implements and .github/quality/lint_baseline.json for the current counts.
  lint-debt-ratchet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install ruff (pinned — see docs/operating/LINT_DEBT_RATCHET.md)
        run: pip install ruff==0.16.4

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Check lint debt against the committed baseline
        run: python scripts/lint_debt_ratchet.py check

  # ── Frontend lint on changed files (blocking) ──────────────────────────────
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Collect changed frontend files
        id: changed-frontend
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi

          mapfile -t CHANGED_FILES < <(
            git diff --name-only --diff-filter=ACMR "${BASE_SHA}" HEAD | \
              grep -E '^frontend/.*\.(js|jsx|ts|tsx)$' || true
          )

          if (( ${#CHANGED_FILES[@]} == 0 )); then
            echo "count=0" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "count=${#CHANGED_FILES[@]}"
            echo "files<<EOF"
            printf '%s\n' "${CHANGED_FILES[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Run ESLint on changed files
        if: steps.changed-frontend.outputs.count != '0'
        working-directory: frontend
        shell: bash
        run: |
          mapfile -t FILES <<'EOF'
          ${{ steps.changed-frontend.outputs.files }}
          EOF

          RELATIVE_FILES=()
          for file in "${FILES[@]}"; do
            RELATIVE_FILES+=("${file#frontend/}")
          done

          npx eslint --max-warnings=0 "${RELATIVE_FILES[@]}"

      - name: Skip message when no frontend files changed
        if: steps.changed-frontend.outputs.count == '0'
        run: echo "No frontend source files changed; skipping blocking ESLint run."

  # ── Frontend unit tests (Vitest) ──────────────────────────────────────────
  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run Vitest
        working-directory: frontend
        run: npm test

      - name: Enforce Design System regression baseline
        working-directory: frontend
        run: npm run design-system:check

  # ── TypeScript type-check ──────────────────────────────────────────────────
  frontend-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: TypeScript check
        working-directory: frontend
        run: npx tsc --noEmit

  # ── Frontend critical-path E2E (Playwright, blocking) ──────────────────────
  # Small deterministic browser-level release gate for #291. The broad E2E
  # suite remains local/manual; only tests tagged @critical block this workflow.
  frontend-e2e-critical:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Install Playwright Chrome + OS dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Run critical-path Playwright suite
        working-directory: frontend
        run: npx playwright test --grep @critical
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Stable required-check aggregate (issue #317 / ER-SDLC-001) ──────────
  # See test.yml's backend-required-gate comment for why this exists: GitHub
  # rulesets reject a "workflows" rule pinning individual job contexts
  # (HTTP 422), so this is the one stable context required_status_checks
  # should target for this workflow.
  lint-required-gate:
    name: lint-required-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [required-gate-coverage-lint, enterprise-readiness-lint, release-evidence-lint, openapi-drift, sdk-clients-drift, i18n-catalog-gates, repo-metrics-drift, domain-scope-lint, entity-query-lint, backend-lint-changed, lint-debt-ratchet, frontend-lint, frontend-test, frontend-typecheck, frontend-e2e-critical]
    steps:
      - name: Require every lint gate job to have succeeded
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_CONTEXT"])
          failed = {name: info["result"] for name, info in results.items() if info["result"] != "success"}
          if failed:
              print(f"::error::Required lint gate job(s) did not succeed: {failed}")
              sys.exit(1)
          print(f"All required lint gate jobs succeeded: {sorted(results)}")
          PY
