name: Backend Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ADMIN_USERNAME: testadmin
  ADMIN_PASSWORD: testpassword
  JWT_SECRET_KEY: test-jwt-secret-key-for-ci-only-not-production
  ALLOWED_ORIGINS: "http://localhost:3004"
  UKIP_SKIP_STARTUP_SIDE_EFFECTS: "1"
  SENTRY_ENABLED: "0"

jobs:
  test-shard:
    name: test-shard-${{ matrix.shard }} (py3.13)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c requirements.lock
          pip install pytest-cov -c requirements.lock

      - name: Collect deterministic shard
        run: |
          python scripts/backend_test_partitions.py list-shard \
            --index "${{ matrix.shard }}" \
            --count 6 \
            --out "shard-${{ matrix.shard }}.txt"
          echo "Shard ${{ matrix.shard }} count: $(wc -l < shard-${{ matrix.shard }}.txt)"

      - name: Run shard with coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          UKIP_DB_MODE: sqlite
          COVERAGE_FILE: "coverage-shard-${{ matrix.shard }}"
        shell: bash
        run: |
          mapfile -t ids < "shard-${{ matrix.shard }}.txt"
          if [ "${#ids[@]}" -eq 0 ]; then
            echo "Shard ${{ matrix.shard }} unexpectedly collected zero tests" >&2
            exit 1
          fi
          pytest "${ids[@]}" \
            --tb=short \
            --cov=backend \
            --cov-report= \
            -q

      - name: Upload shard evidence
        uses: actions/upload-artifact@v7
        with:
          name: backend-shard-${{ matrix.shard }}
          path: |
            shard-${{ matrix.shard }}.txt
            coverage-shard-${{ matrix.shard }}
          retention-days: 14

  test-py312-compat:
    name: test-py312-compat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Run representative compatibility lane
        env:
          DATABASE_URL: "sqlite:///:memory:"
          UKIP_DB_MODE: sqlite
        run: |
          pytest backend/tests/ \
            -m "unit or contract or security" \
            --tb=short \
            -q

  test-partition-guard:
    name: test-partition-guard-and-coverage
    runs-on: ubuntu-latest
    needs: [test-shard]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -c requirements.lock
          pip install coverage pytest-cov -c requirements.lock

      - name: Download all shard artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: backend-shard-*
          merge-multiple: true
          path: shard-artifacts

      - name: Verify partition union equals exhaustive suite
        run: |
          python scripts/backend_test_partitions.py verify \
            --count 6 \
            --shard-file shard-artifacts/shard-0.txt \
            --shard-file shard-artifacts/shard-1.txt \
            --shard-file shard-artifacts/shard-2.txt \
            --shard-file shard-artifacts/shard-3.txt \
            --shard-file shard-artifacts/shard-4.txt \
            --shard-file shard-artifacts/shard-5.txt

      - name: Audit pytest marker taxonomy
        run: python scripts/backend_test_partitions.py audit-markers

      - name: Combine shard coverage and enforce threshold
        run: |
          coverage combine shard-artifacts/coverage-shard-0 \
            shard-artifacts/coverage-shard-1 \
            shard-artifacts/coverage-shard-2 \
            shard-artifacts/coverage-shard-3 \
            shard-artifacts/coverage-shard-4 \
            shard-artifacts/coverage-shard-5
          coverage report --fail-under=75
          coverage xml -o coverage.xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  eval-quality:
    name: Entity-resolution quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Run entity-resolution eval harness (F1 gate)
        run: |
          python -m backend.eval.entity_resolution_eval --gate 0.75 --algorithm blocking --threshold 80

  postgres-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Prepare ephemeral CI secrets
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import secrets
          from cryptography.fernet import Fernet
          pw = secrets.token_hex(16)
          print(f"ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          print(f"SESSION_SECRET_KEY={secrets.token_urlsafe(32)}")
          print(f"PG_PASSWORD={pw}")
          print(f"DATABASE_URL=postgresql+psycopg2://ukip_test:{pw}@localhost:5432/ukip_test")
          print("UKIP_DB_MODE=postgres")
          PY

      - name: Start PostgreSQL (retry pull to absorb Docker Hub hiccups)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          fi
          for attempt in 1 2 3 4 5; do
            if docker pull postgres:16-alpine; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "postgres image pull failed after 5 attempts" >&2
              exit 1
            fi
            echo "pull failed (attempt ${attempt}) — retrying after backoff…"
            sleep $((attempt * 5))
          done
          docker run -d --name ukip-postgres \
            -e POSTGRES_USER=ukip_test \
            -e POSTGRES_PASSWORD="${PG_PASSWORD}" \
            -e POSTGRES_DB=ukip_test \
            -p 5432:5432 \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec ukip-postgres pg_isready -U ukip_test >/dev/null 2>&1; then
              echo "PostgreSQL ready"
              break
            fi
            if [ "${attempt}" -eq 30 ]; then
              echo "PostgreSQL did not become ready in time" >&2
              docker logs ukip-postgres || true
              exit 1
            fi
            sleep 2
          done

      - name: Validate PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Smoke-test real startup against PostgreSQL
        env:
          UKIP_SKIP_STARTUP_SIDE_EFFECTS: "0"
          PYTHONPATH: .
        run: python scripts/ci_lifespan_smoke.py

      - name: Run the backend suite against PostgreSQL
        env:
          UKIP_SKIP_STARTUP_SIDE_EFFECTS: "1"
        run: pytest backend/tests/ --tb=short -q

  sdk-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install backend dependencies
        run: pip install -r requirements.txt -c requirements.lock

      - name: Prepare ephemeral CI secrets
        run: |
          python - >> "$GITHUB_ENV" <<'PY'
          import secrets
          from cryptography.fernet import Fernet
          pw = secrets.token_hex(16)
          print(f"ENCRYPTION_KEY={Fernet.generate_key().decode()}")
          print(f"SESSION_SECRET_KEY={secrets.token_urlsafe(32)}")
          print(f"PG_PASSWORD={pw}")
          print(f"DATABASE_URL=postgresql+psycopg2://ukip_test:{pw}@localhost:5432/ukip_test")
          print("UKIP_DB_MODE=postgres")
          PY

      - name: Start PostgreSQL (retry pull to absorb Docker Hub hiccups)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin
          fi
          for attempt in 1 2 3 4 5; do
            docker pull postgres:16-alpine && break
            [ "${attempt}" -eq 5 ] && { echo "postgres pull failed" >&2; exit 1; }
            sleep $((attempt * 5))
          done
          docker run -d --name ukip-postgres \
            -e POSTGRES_USER=ukip_test \
            -e POSTGRES_PASSWORD="${PG_PASSWORD}" \
            -e POSTGRES_DB=ukip_test \
            -p 5432:5432 \
            postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec ukip-postgres pg_isready -U ukip_test >/dev/null 2>&1; then
              echo "PostgreSQL ready"; break
            fi
            [ "${attempt}" -eq 30 ] && { docker logs ukip-postgres || true; exit 1; }
            sleep 2
          done

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Start the backend (scopes enforced) and wait for health
        env:
          UKIP_API_KEY_SCOPES_ENFORCED: "1"
          UKIP_SKIP_STARTUP_SIDE_EFFECTS: "0"
          ENGINE_FALLBACK_PYTHON: "true"
          PYTHONPATH: .
        run: |
          uvicorn backend.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          echo $! > uvicorn.pid
          for attempt in $(seq 1 40); do
            if curl -sf http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "backend healthy"; exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy" >&2
          cat uvicorn.log || true
          exit 1

      - name: Python client smoke (auth + list + scope-403)
        env:
          UKIP_SMOKE_BASE_URL: http://127.0.0.1:8000
          UKIP_SMOKE_USERNAME: ${{ env.ADMIN_USERNAME }}
          UKIP_SMOKE_PASSWORD: ${{ env.ADMIN_PASSWORD }}
          UKIP_SMOKE_EXPECT_ENFORCEMENT: "1"
        run: |
          pip install ./sdk/python
          python sdk/smoke/smoke.py

      - name: TypeScript client smoke (auth + list)
        env:
          UKIP_SMOKE_BASE_URL: http://127.0.0.1:8000
          UKIP_SMOKE_USERNAME: ${{ env.ADMIN_USERNAME }}
          UKIP_SMOKE_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: npx -y tsx@4.19.2 sdk/smoke/smoke.ts

      - name: Stop the backend
        if: always()
        run: |
          [ -f uvicorn.pid ] && kill "$(cat uvicorn.pid)" 2>/dev/null || true
