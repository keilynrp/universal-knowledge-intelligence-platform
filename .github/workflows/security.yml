name: Security Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Secret scan (blocking) ──────────────────────────────────────────────
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so gitleaks scans all commits in the PR)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ── Backend dependency audit (blocking; exceptions via --ignore-vuln) ───
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pip-audit (pinned; bump intentionally — see SECURITY_GATES.md)
        run: pip install "pip-audit==2.10.1"

      - name: Audit pinned backend dependencies
        # Ratchet baseline: every --ignore-vuln entry must have a row in
        # docs/operating/SECURITY_GATES.md with justification + expiry.
        # --no-deps: requirements.lock is a flat freeze (no hashes); pip
        # resolver is disabled via --disable-pip so no network lookup needed.
        #
        # Five entries, down from 33 at gate introduction. The old list
        # deferred most of its entries to "the upgrade sprint"; #202 was
        # that sprint, and the resulting versions reached or passed every
        # fix version the baseline recorded, so 31 flags were suppressing
        # advisories that no longer applied.
        #
        # These use the canonical IDs pip-audit emits, not hand-picked CVE
        # aliases. The old list matched via aliases, which is how 34 flags
        # could do two flags' worth of work without anyone noticing: an
        # alias that stops matching fails silently, and a flag that matches
        # nothing looks identical to a flag that is still holding something
        # back. chromadb's three 2026-08-24 advisories were first emitted as
        # CVE-2026-45830/45831/45833, before the PyPA DB had PYSEC entries;
        # since then pip-audit emits PYSEC-2026-3813/3815/3814, so the flags
        # were matching through aliases. Switched at the 2026-09-30 review.
        # CVE-2026-49265 (oauthlib, 2026-09-29) arrives only through
        # chromadb -> kubernetes -> requests-oauthlib, none of which the
        # backend image installs, and it sits in oauthlib's OAuth *server*
        # PKCE check, which UKIP never runs (its SSO is an Authlib client).
        # See docs/operating/SECURITY_GATES.md §7e for full disposition.
        run: >-
          pip-audit -r requirements.lock --disable-pip --no-deps
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3814
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln CVE-2026-49265

  # ── Frontend dependency audit (blocking; allowlist via wrapper) ─────────
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --prefer-offline

      - name: Run npm-audit gate
        working-directory: frontend
        run: npm run audit:gate

  # ── Stable required-check aggregate (issue #317 / ER-SDLC-001) ──────────
  # See test.yml's backend-required-gate comment for why this exists: GitHub
  # rulesets reject a "workflows" rule pinning individual job contexts
  # (HTTP 422), so this is the one stable context required_status_checks
  # should target for this workflow.
  security-required-gate:
    name: security-required-gate
    runs-on: ubuntu-latest
    if: always()
    needs: [gitleaks, pip-audit, npm-audit]
    steps:
      - name: Require every security gate job to have succeeded
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_CONTEXT"])
          failed = {name: info["result"] for name, info in results.items() if info["result"] != "success"}
          if failed:
              print(f"::error::Required security gate job(s) did not succeed: {failed}")
              sys.exit(1)
          print(f"All required security gate jobs succeeded: {sorted(results)}")
          PY
