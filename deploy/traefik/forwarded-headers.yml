# Reviewed copy of the forwardedHeaders setting for Dokploy's Traefik entry
# points (#413). Paste it into Dokploy's traefik.yml under each entry point
# that receives public traffic (Dokploy names them `web` and `websecure`;
# check yours), then restart Traefik.
#
# Without it Traefik discards the X-Forwarded-For that Cloudflare sends and
# replaces it with Cloudflare's edge address, so the backend can only ever
# see Cloudflare. With it, Traefik keeps the client address Cloudflare
# recorded, but only when the request really came from Cloudflare: a request
# that reaches the origin directly still has its header replaced.
#
# The list must be exactly Cloudflare's ranges in docker/trusted-proxies.txt;
# backend/tests/test_client_ip_behind_proxies.py compares them. Never add the
# internal networks here: Traefik is the edge of the host.

entryPoints:
  web:
    forwardedHeaders:
      trustedIPs: &cloudflare
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  websecure:
    forwardedHeaders:
      trustedIPs: *cloudflare
